name: Model and RTL checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-11-04'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/run.py unit
      - run: python scripts/run.py compare
# Full UVM and physical checks require the qualified external toolchain.

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-comparison-logs
          path: results/
